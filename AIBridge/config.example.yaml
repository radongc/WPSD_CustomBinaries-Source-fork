# AIBridge configuration.
# Copy to /etc/aibridge/config.yaml and edit.

listen:
  # UDP socket the bridge listens on for MMDVMHost's P25 network traffic.
  # MMDVMHost.ini [P25 Network] GatewayAddress/GatewayPort must match these.
  host: "0.0.0.0"
  port: 42020

mmdvm:
  # Where we send TX traffic. Usually the bridge learns this automatically
  # from the first RX packet (the source address of MMDVMHost). Override
  # only if MMDVMHost binds RX and TX to different ports.
  # host: "127.0.0.1"
  # port: 42010

upstream:
  # Optional transparent passthrough to a regular P25 gateway
  # (P25Gateway, etc.) so non-bot talkgroups keep working normally.
  #
  # When configured, every packet from MMDVMHost is mirrored to this
  # address, and replies from this endpoint are forwarded back to
  # MMDVMHost. The bot only acts on calls whose dst_id matches the
  # bot.dst_id below; everything else just passes through, exactly as
  # if MMDVMHost were pointed straight at the gateway.
  #
  # Typical WPSD setup: move P25Gateway off of 42020 (or move the
  # bridge off of 42020 and point MMDVMHost at the bridge's new port),
  # and set upstream below to wherever P25Gateway now listens.
  #
  # Leave commented out to disable passthrough — the bridge will then
  # intercept every TG as bot, which is the old behaviour.
  # host: 127.0.0.1
  # port: 42030

bot:
  # P25 source ID the bot transmits as (24-bit unit ID). Pick something
  # not used by any of your real radios.
  src_id: 1234567

  # Talkgroup / destination ID. Match this to your radio's TG.
  dst_id: 1

  lcf: 0
  mfid: 0

stt:
  # kind: "whisper" (real) or "mock" (returns canned text)
  kind: whisper
  binary: /opt/whisper.cpp/build/bin/whisper-cli
  # base.en runs at ~real-time on a Pi (vs ~3x real-time for small.en)
  # and is the recommended default. small.en gives better accuracy on
  # very noisy audio if you don't mind the latency.
  model_path: /opt/whisper.cpp/models/ggml-base.en.bin
  threads: 4

llm:
  # kind: "claude" or "mock"
  kind: claude

  # Either put the key here or set ANTHROPIC_API_KEY in the env. Env wins
  # if both are set. Keep this file readable only by root if you put the
  # key here (chmod 600 /etc/aibridge/config.yaml).
  api_key: ""

  model: claude-haiku-4-5-20251001
  max_tokens: 200

  # Anthropic-hosted web search (server-side tool). Lets the model answer
  # questions about current events, weather, prices, sports scores, etc.
  # Billed per search at $0.01 each — cap with web_search_max_uses.
  # Claude only invokes the tool when it judges a search is actually
  # needed, so leaving this on is usually fine.
  web_search: true
  web_search_max_uses: 3

  # When true, append the speaker's P25 unit ID (src_id) to the system
  # prompt for that conversation. The model can reference it if asked
  # ("what's my unit ID?") but won't announce it spontaneously.
  include_unit_id: false

  # Client-side tool that lets the model query the radioid.net amateur
  # radio database by unit ID. Pairs well with include_unit_id — the
  # model can answer "what's my callsign?" by looking the caller's
  # src_id up directly. No external account needed. max_tool_rounds is
  # a safety cap on the per-response tool-use loop.
  radioid_lookup: true
  # Client-side tool that queries api.hamdb.org for an amateur callsign
  # (US FCC + DXCC data). Returns licensee name, license class /
  # expiration, locality, and Maidenhead grid. House number and ZIP are
  # filtered server-side here for privacy — over a public hotspot we
  # voice street name + city + state only, never the full address.
  callsign_lookup: true
  max_tool_rounds: 4

  system_prompt: |
    You are a helpful AI assistant accessible by amateur radio over a P25
    voice link. Keep responses short, plain, and easy to follow when heard
    aloud — under 40 words. No code blocks, no markdown, no lists.
    You have web search — use it for current events, weather, prices, or
    anything time-sensitive. Speak naturally; never read URLs or citation
    numbers aloud, just paraphrase what you found.

tts:
  # kind: "piper" or "mock"
  kind: piper
  binary: piper
  # ryan-medium: deeper male voice, medium quality. Same voice character
  # as ryan-high but renders ~2-3x faster on Pi-class hardware
  # (~0.8s vs ~2s+). Best speed/quality tradeoff. Other options:
  #   en_US-ryan-high          (same voice, most natural, but slow on Pi)
  #   en_US-lessac-medium      (female, very clean prosody)
  #   en_US-libritts_r-medium  (smoother/expressive, slightly slower)
  #   en_GB-jenny_dioco-medium (British, pleasant)
  voice_path: /opt/piper/voices/en_US-ryan-medium.onnx
  voice_rate: 22050  # native rate of the Piper voice; resampled to 8 kHz
